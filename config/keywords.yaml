evidence_statuses:
  - id: "OFFICIAL_STATEMENT"
    label: "Official Statement"
    description: "Published directly by the platform, team, or official channels."
  - id: "CORROBORATED"
    label: "Independently Corroborated"
    description: "Confirmed across multiple distinct, independent sources or official registries."
  - id: "REPORTED_ALLEGATION"
    label: "Reported Allegation"
    description: "Specific claim or accusation reported by an individual or third-party without formal validation."
  - id: "PERSONAL_TESTIMONIAL"
    label: "Personal Opinion / Testimonial"
    description: "Subjective user account, recommendation, or endorsement."
  - id: "UNVERIFIED"
    label: "Unverified"
    description: "Single unconfirmed public mention or forum snippet."
  - id: "UNABLE_TO_VERIFY"
    label: "Unable to Verify"
    description: "Insufficient source details or inaccessible origin link."
